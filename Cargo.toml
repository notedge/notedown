[workspace]
resolver = "2"
members = [
    "projects/crates/notedown",
    "projects/crates/notedown-ir",
    "projects/crates/notedown-formats",
    "projects/crates/notedown-fixtures",
    "projects/crates/davinci-types",
    "projects/crates/davinci-scene",
    "projects/crates/davinci-diagram",
    "projects/crates/davinci-chart",
    "projects/crates/davinci-runtime",
    "projects/crates/davinci-motion",
]
default-members = [
    "projects/crates/notedown",
    "projects/crates/notedown-ir",
    "projects/crates/notedown-formats",
    "projects/crates/notedown-fixtures",
    "projects/crates/davinci-types",
    "projects/crates/davinci-scene",
    "projects/crates/davinci-diagram",
    "projects/crates/davinci-runtime",
    "projects/crates/davinci-motion",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
# Boost dependencies
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-benchmark = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86" }
boost-diagnostic = { git = "https://github.com/oovm/rust-boost", rev = "9aa52745d6eae2d7748c76e4e3e6555e1f6e4b86", default-features = false, features = ["std", "serde"] }
# Binary Readers
acorn-codec = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996", default-features = false, features = ["compression"] }
acorn-core = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-cfb = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-doc = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-docx = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-epub = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
# Overlaid by local path `.cargo/config.toml` (git ignored).
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe" }
oak-markdown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }
oak-notedown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }
oak-html = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }
oak-xml = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }
oak-org-mode = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }
oak-tex = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }
oak-typst = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }
oak-testing = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe" }

notedown = { path = "projects/crates/notedown" }
notedown-ir = { path = "projects/crates/notedown-ir" }
notedown-formats = { path = "projects/crates/notedown-formats", default-features = false }
notedown-fixtures = { path = "projects/crates/notedown-fixtures" }

# DaVinci diagram subsystem
davinci-types = { path = "projects/crates/davinci-types" }
davinci-scene = { path = "projects/crates/davinci-scene" }
davinci-diagram = { path = "projects/crates/davinci-diagram" }
davinci-chart = { path = "projects/crates/davinci-chart" }
davinci-runtime = { path = "projects/crates/davinci-runtime" }
davinci-motion = { path = "projects/crates/davinci-motion" }
oak-mermaid = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "59c7d479882bc08124c81f95d03b154b5cecdcbe", default-features = false, features = ["serde"] }

# External dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
cfb = "0.15.0"

# Benchmark comparison only — production path uses acorn-codec.
# Kept so that comparative benchmarks between flate2 and acorn-codec
# remain possible. Do NOT add this to any crate's [dependencies]; use as
# dev-dependency only for benchmark fixtures.
flate2 = "1.1.10"

[profile.release]
lto = true
opt-level = "s"
