[workspace]
resolver = "2"
members = [
    "projects/crates/notedown",
    "projects/crates/notedown-ir",
    "projects/crates/notedown-formats",
    "projects/crates/notedown-fixtures",
]
default-members = [
    "projects/crates/notedown",
    "projects/crates/notedown-ir",
    "projects/crates/notedown-formats",
    "projects/crates/notedown-fixtures",
]
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
# Boost dependencies
# Overlaid by local path `.cargo/config.toml` (git ignored).
boost-benchmark = { git = "https://github.com/oovm/rust-boost", rev = "465e3e5eb263f1d2b6f7429c426c5e78064182bc" }
# Binary Readers
acorn-core = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-cfb = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-doc = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-docx = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
acorn-epub = { git = "https://github.com/yggdrasil-language/acorn.rs.git", rev = "fbed2df1626ec3800cb2e54b7b9c730bf8a2f996" }
# Overlaid by local path `.cargo/config.toml` (git ignored).
oak-core = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c126aa4be34d380317539053566b8b0436015130" }
oak-markdown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c126aa4be34d380317539053566b8b0436015130", default-features = false, features = ["serde"] }
oak-notedown = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c126aa4be34d380317539053566b8b0436015130", default-features = false, features = ["serde"] }
oak-html = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c126aa4be34d380317539053566b8b0436015130", default-features = false, features = ["serde"] }
oak-xml = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c126aa4be34d380317539053566b8b0436015130", default-features = false, features = ["serde"] }
oak-org-mode = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c126aa4be34d380317539053566b8b0436015130", default-features = false, features = ["serde"] }
oak-testing = { git = "https://github.com/yggdrasil-language/oak.rs.git", rev = "c126aa4be34d380317539053566b8b0436015130" }

notedown = { path = "projects/crates/notedown" }
notedown-ir = { path = "projects/crates/notedown-ir" }
notedown-formats = { path = "projects/crates/notedown-formats" }
notedown-fixtures = { path = "projects/crates/notedown-fixtures" }

# External dependencies
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
cfb = "0.15.0"

# Benchmark Only dependencies
flate2 = "1.1.10"

[profile.release]
lto = true
opt-level = "s"
