[package]
name = "davinci-diagram"
version.workspace = true
authors.workspace = true
description = "Diagram semantics to DaVinci vector scene lowering for Oak Mermaid flowcharts, sequences, and class diagrams"
repository = "https://github.com/notedge/notedown"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
davinci-types = { workspace = true }
davinci-scene = { workspace = true }
oak-core = { workspace = true, optional = true }
oak-mermaid = { workspace = true, optional = true }
oak-uml = { workspace = true, optional = true }

[features]
default = ["mermaid"]
mermaid = ["dep:oak-core", "dep:oak-mermaid", "dep:oak-uml"]
