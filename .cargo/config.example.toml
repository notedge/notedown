# Copy to `config.toml` (gitignored) and replace `<your-path>` with your local absolute path.
# Committed `Cargo.toml` uses git `branch = "dev"` so CI and fresh clones resolve from remote.

[target.wasm32-unknown-unknown]
runner = 'wasm-bindgen-test-runner'

[patch."https://github.com/yggdrasil-language/oak.rs.git"]
oak-core = { path = "<your-path>/oaks/projects/oak-core" }
oak-markdown = { path = "<your-path>/oaks/examples/oak-markdown" }
oak-notedown = { path = "<your-path>/oaks/examples/oak-notedown" }
oak-html = { path = "<your-path>/oaks/examples/oak-html" }
oak-xml = { path = "<your-path>/oaks/examples/oak-xml" }
oak-org-mode = { path = "<your-path>/oaks/examples/oak-org-mode" }
oak-css-selector = { path = "<your-path>/oaks/examples/oak-css-selector" }
oak-xpath = { path = "<your-path>/oaks/examples/oak-xpath" }
oak-testing = { path = "<your-path>/oaks/projects/oak-testing" }

[patch."https://github.com/yggdrasil-language/acorn.rs.git"]
acorn-core = { path = "<your-path>/acorn.rs/projects/acorn-core" }
acorn-cfb = { path = "<your-path>/acorn.rs/examples/acorn-cfb" }
acorn-doc = { path = "<your-path>/acorn.rs/examples/acorn-doc" }
acorn-docx = { path = "<your-path>/acorn.rs/examples/acorn-docx" }
acorn-epub = { path = "<your-path>/acorn.rs/examples/acorn-epub" }

[patch."https://github.com/oovm/rust-boost"]
boost-benchmark = { path = "<your-path>/rust-boost/projects/boost-benchmark" }
