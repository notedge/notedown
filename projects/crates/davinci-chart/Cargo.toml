[package]
name = "davinci-chart"
version.workspace = true
authors.workspace = true
description = "Chart semantics compiled into generic DaVinci vector scenes"
repository = "https://github.com/notedge/notedown"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
davinci-types = { workspace = true }
davinci-scene = { workspace = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
vega-lite = ["dep:serde_json"]

[[test]]
name = "vega_lite"
path = "tests/vega_lite/mod.rs"
required-features = ["vega-lite"]
