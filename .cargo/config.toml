# Local path overlay for workspace crates.
# Committed `Cargo.toml` uses git `branch = "dev"` so CI and fresh clones resolve from remote.

[target.wasm32-unknown-unknown]
runner = 'wasm-bindgen-test-runner'

[patch."https://github.com/notedge/notedown.git"]
notedown-error = { path = "projects/crates/notedown-error" }
notedown_parser = { path = "projects/crates/notedown-parser" }
notedown_ast = { path = "projects/packages/notedown-ast" }
text-utils = { path = "projects/packages/text-utils" }
notedown-rt = { path = "projects/packages/notedown-runtime" }

[patch."https://github.com/yggdrasil-language/oaks.git"]
oak-core = { path = "../oaks/projects/oak-core" }
oak-markdown = { path = "../oaks/examples/oak-markdown" }
