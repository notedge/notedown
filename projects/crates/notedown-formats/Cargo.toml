[package]
name = "notedown-formats"
version.workspace = true
authors.workspace = true
description = "Notedown document import and export format modules"
repository = "https://github.com/notedge/notedown"
readme = "readme.md"
license.workspace = true
edition.workspace = true

[dependencies]
boost-diagnostic = { workspace = true }
notedown-ir = { workspace = true }
acorn-codec = { workspace = true, optional = true }
oak-core = { workspace = true, optional = true }
oak-markdown = { workspace = true, optional = true }
oak-notedown = { workspace = true, optional = true }
acorn-core = { workspace = true, optional = true }
acorn-doc = { workspace = true, optional = true }
acorn-docx = { workspace = true, optional = true }
acorn-epub = { workspace = true, optional = true }
oak-html = { workspace = true, optional = true }
oak-xml = { workspace = true, optional = true }
oak-tex = { workspace = true, optional = true }
oak-typst = { workspace = true, optional = true }

[features]
default = ["markdown"]
markdown = ["dep:oak-core", "dep:oak-markdown"]
notedown = ["dep:oak-core", "dep:oak-notedown"]
docx = ["dep:acorn-core", "dep:acorn-docx", "dep:oak-core", "dep:oak-xml"]
doc = ["dep:acorn-doc"]
pdf = ["dep:acorn-codec"]
epub = ["dep:acorn-core", "dep:acorn-epub", "dep:oak-core", "dep:oak-html"]
html = ["dep:oak-core", "dep:oak-html"]
tex = ["dep:oak-core", "dep:oak-tex"]
typst = ["dep:oak-core", "dep:oak-typst"]

[[test]]
name = "capability"
path = "tests/capability.rs"

[[test]]
name = "common"
path = "tests/common/mod.rs"
required-features = ["markdown"]

[[test]]
name = "provenance"
path = "tests/provenance/mod.rs"
required-features = ["markdown"]

[[test]]
name = "markdown"
path = "tests/markdown/mod.rs"
required-features = ["markdown"]

[[test]]
name = "markdown_roundtrip"
path = "tests/markdown/roundtrip.rs"
required-features = ["markdown"]

[[test]]
name = "markdown_export_project"
path = "tests/markdown/export_project.rs"
required-features = ["markdown"]

[[test]]
name = "notedown"
path = "tests/notedown/mod.rs"
required-features = ["markdown", "notedown"]

[[test]]
name = "docx"
path = "tests/docx/mod.rs"
required-features = ["docx", "markdown"]

[[test]]
name = "docx_export"
path = "tests/docx/export.rs"
required-features = ["docx", "markdown"]

[[test]]
name = "docx_import_numbering"
path = "tests/docx/import_numbering.rs"
required-features = ["docx"]

[[test]]
name = "docx_import_xml"
path = "tests/docx/import_xml.rs"
required-features = ["docx", "markdown"]

[[test]]
name = "docx_import_xml_extensions"
path = "tests/docx/import_xml_extensions.rs"
required-features = ["docx"]

[[test]]
name = "docx_inspect"
path = "tests/docx/inspect.rs"
required-features = ["docx"]

[[test]]
name = "doc"
path = "tests/doc/mod.rs"
required-features = ["doc"]

[[test]]
name = "doc_import"
path = "tests/doc/import.rs"
required-features = ["doc"]

[[test]]
name = "epub"
path = "tests/epub/mod.rs"
required-features = ["epub", "markdown"]

[[test]]
name = "epub_import_ast_lowering"
path = "tests/epub/import_ast_lowering.rs"
required-features = ["epub"]

[[test]]
name = "epub_import_navigation"
path = "tests/epub/import_navigation.rs"
required-features = ["epub"]

[[test]]
name = "epub_import_xhtml"
path = "tests/epub/import_xhtml.rs"
required-features = ["epub", "markdown"]

[[test]]
name = "pdf"
path = "tests/pdf/mod.rs"
required-features = ["pdf"]

[[test]]
name = "pdf_import_internal"
path = "tests/pdf/import_internal.rs"
required-features = ["pdf"]

[[test]]
name = "html"
path = "tests/html/mod.rs"
required-features = ["html", "markdown"]

[[test]]
name = "html_import"
path = "tests/html/import.rs"
required-features = ["html", "markdown"]

[[test]]
name = "tex_import"
path = "tests/tex/mod.rs"
required-features = ["tex"]

[[test]]
name = "typst_import"
path = "tests/typst/mod.rs"
required-features = ["typst"]

[[test]]
name = "markdown_to_docx"
path = "tests/integration/markdown_to_docx.rs"
required-features = ["docx", "markdown"]

[[test]]
name = "markdown_to_epub"
path = "tests/integration/markdown_to_epub.rs"
required-features = ["epub", "markdown"]

[dev-dependencies]
cfb = { workspace = true }
serde_json = { workspace = true }
oak-core = { workspace = true }
oak-html = { workspace = true }
